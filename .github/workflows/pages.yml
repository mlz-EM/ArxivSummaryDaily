name: pages
on:
  schedule:
    # Runs at 5:00 AM Eastern Time every workday (Monday to Friday)
    - cron: '1 0 * * 1-5'
      timezone: 'America/New_York'
  # Or you can trigger it manually
  workflow_dispatch:
  
jobs:
  build:
    env:
      LLM_MODEL: gemini-3.6-flash
    concurrency:
      group: arxivsummary-data-main
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target repo (personal-site)
        uses: actions/checkout@v4
        with:
          repository: mlz-EM/personal-site
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: personal-site

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Bootstrap JSON state from personal-site
        run: |
          mkdir -p data
          if [ ! -s data/arXivDaily.json ] && [ -f personal-site/src/data/arXivDaily.json ]; then
            cp personal-site/src/data/arXivDaily.json data/arXivDaily.json
          fi
          if [ ! -s data/jobsDaily.json ] && [ -f personal-site/src/data/jobsDaily.json ]; then
            cp personal-site/src/data/jobsDaily.json data/jobsDaily.json
          fi

      - name: Get pip cache dir
        id: pip-cache
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install package
        run: pip install -e .

      - name: Make Configuration
        run: cp ./config/settings.example.py ./config/settings.py
      
      - name: Build the arXiv data
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: arxivsummary

      - name: Discover new Interfolio jobs
        env:
          INTERFOLIO_ENABLE_LIVE: 'true'
        run: |
          if [ ! -s data/interfolioScanState.json ]; then
            echo "::warning::Interfolio bootstrap state is absent; run the documented local bootstrap first."
            exit 0
          fi
          interfoliojobs --output-dir data scan --mode daily --start-id 180000

      - name: Update Interfolio tenant directory
        run: |
          if [ -s data/interfolioJobsPending.json ]; then
            interfoliojobs --output-dir data directory
          fi

      - name: Summarize new Interfolio jobs
        id: summarize-interfolio
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -s data/interfolioJobsPending.json ]; then
            interfoliojobs --output-dir data summarize
          fi

      - name: Discover new Chronicle jobs
        env:
          CHRONICLE_ENABLE_LIVE: 'true'
        run: |
          if [ ! -s data/chronicleScanState.json ]; then
            echo "::warning::Chronicle bootstrap state is absent; run the documented local bootstrap first."
            exit 0
          fi
          chroniclejobs --output-dir data scan --mode daily

      - name: Summarize new Chronicle jobs
        id: summarize-chronicle
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -s data/chronicleJobsPending.json ]; then
            chroniclejobs --output-dir data summarize
          fi

      - name: Discover new Inside Higher Ed jobs
        env:
          INSIDE_HIGHER_ED_ENABLE_LIVE: 'true'
        run: |
          if [ ! -s data/insideHigherEdScanState.json ]; then
            echo "::warning::Inside Higher Ed bootstrap state is absent; run the documented local bootstrap first."
            exit 0
          fi
          insidehigheredjobs --output-dir data scan --mode daily

      - name: Summarize new Inside Higher Ed jobs
        id: summarize-inside-higher-ed
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -s data/insideHigherEdJobsPending.json ]; then
            insidehigheredjobs --output-dir data summarize
          fi

      - name: Build the Job data
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: jobsummary

      - name: Report deferred faculty-job summaries
        if: always()
        run: |
          if [ "${{ steps.summarize-interfolio.outcome }}" = "failure" ]; then
            echo "::warning::Interfolio summary incomplete; its pending queue will be committed for retry."
          fi
          if [ "${{ steps.summarize-chronicle.outcome }}" = "failure" ]; then
            echo "::warning::Chronicle summary incomplete; its pending queue will be committed for retry."
          fi
          if [ "${{ steps.summarize-inside-higher-ed.outcome }}" = "failure" ]; then
            echo "::warning::Inside Higher Ed summary incomplete; its pending queue will be committed for retry."
          fi

      - name: Commit database files to main repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Update database tracking files" || echo "No database changes"
          git push origin main

      - name: Copy JSON feed files to personal-site/src/data
        run: |
          cp ./data/*Daily.json personal-site/src/data/
          if [ -s data/interfolioJobsSummary.json ]; then
            cp data/interfolioJobsSummary.json personal-site/src/data/
          fi
          if [ -s data/chronicleJobsSummary.json ]; then
            cp data/chronicleJobsSummary.json personal-site/src/data/
          fi
          if [ -s data/insideHigherEdJobsSummary.json ]; then
            cp data/insideHigherEdJobsSummary.json personal-site/src/data/
          fi

      - name: Commit and push to personal-site
        run: |
          cd personal-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/arXivDaily.json
          git add src/data/jobsDaily.json
          if [ -f src/data/interfolioJobsSummary.json ]; then
            git add src/data/interfolioJobsSummary.json
          fi
          if [ -f src/data/chronicleJobsSummary.json ]; then
            git add src/data/chronicleJobsSummary.json
          fi
          if [ -f src/data/insideHigherEdJobsSummary.json ]; then
            git add src/data/insideHigherEdJobsSummary.json
          fi
          git commit -m "Update JSON feeds from run ${{ github.run_id }}" || echo "No changes to commit"
          git push
